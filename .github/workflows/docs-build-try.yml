name: Try build docs

on:
  pull_request:
  push:
    branches:
      - "renovate/*"

jobs:
  build-try:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        working-directory: docs/
        run: |
          mkdocs build --strict